<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="neonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffd60a;stop-opacity:0.3" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .cherry { animation: float 3s ease-in-out infinite; }
      .flower { animation: spin 4s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="url(#neonGrad1)"/>

  <circle cx="100" cy="100" r="40" fill="none" stroke="#ff006e" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>

  <circle cx="1100" cy="500" r="30" fill="none" stroke="#ffd60a" stroke-width="2" opacity="0.5"/>
  <circle cx="1100" cy="500" r="45" fill="none" stroke="#ff006e" stroke-width="1" opacity="0.3"/>

  <path d="M 300 300 Q 400 200, 500 300 T 700 300" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>
  <path d="M 600 100 Q 700 150, 800 100" fill="none" stroke="#ff006e" stroke-width="2" opacity="0.3"/>

  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#ff006e" opacity="0.1" font-size="120" font-weight="bold">✨</text>
</svg>
